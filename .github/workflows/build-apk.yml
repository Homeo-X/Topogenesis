name: Build Android APK

on:
  push:
    branches:
      - claude/apk-file-delivery-583o9b
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK build tools and platform
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;35.0.0" \
            "platforms;android-35" 2>/dev/null || \
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-34" 2>/dev/null || true

      - name: Install npm dependencies
        working-directory: mobile
        run: npm ci

      - name: Run Expo prebuild (generate Android project)
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://cswwxwckwaygvfkshupu.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_j3ZOU5hh1ulSQKcHdT3yzQ_jtwU7Hky

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m"
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          EXPO_PUBLIC_SUPABASE_URL: https://cswwxwckwaygvfkshupu.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_j3ZOU5hh1ulSQKcHdT3yzQ_jtwU7Hky

      - name: Verify APK exists
        run: |
          APK_PATH="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-system-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        run: |
          TAG="forge-v2.8-build-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "Forge System OS v2.8 — Debug APK (Build ${{ github.run_number }})" \
            --notes "$(cat <<'EOF'
          ## Forge System OS v2.8 — GoalUI Debug Build

          **Install instructions:**
          1. On your Android device, go to Settings → Security → enable "Install unknown apps" for your browser or file manager
          2. Download this APK and tap to install

          **Backend:** Connects to Supabase project `cswwxwckwaygvfkshupu`
          EOF
          )" \
            --prerelease \
            "$APK_PATH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
