name: Build Android APK

on:
  push:
    branches: [claude/homeorealm-mmorpg-build-8gjv55, main]
    paths:
      - 'homeorealm/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homeorealm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: homeorealm/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Build standalone web app
        run: npm run build:standalone
        working-directory: homeorealm/packages/web-client

      - name: Install Capacitor CLI + packages
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
        working-directory: homeorealm/packages/web-client

      - name: Add Android platform
        run: npx cap add android
        working-directory: homeorealm/packages/web-client

      - name: Sync web assets into Android project
        run: npx cap sync android
        working-directory: homeorealm/packages/web-client

      - name: Make gradlew executable
        run: chmod +x android/gradlew
        working-directory: homeorealm/packages/web-client

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: homeorealm/packages/web-client/android

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore homeorealm-release.jks \
            -alias homeorealm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass HomeoRealm2025! \
            -keypass HomeoRealm2025! \
            -dname "CN=HomeoRealm,O=HomeoRealm,C=US" \
            -noprompt
        working-directory: homeorealm/packages/web-client/android

      - name: Sign release APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | sort -rV | head -1)
          echo "Using apksigner: $APKSIGNER"
          $APKSIGNER sign \
            --ks homeorealm-release.jks \
            --ks-pass pass:HomeoRealm2025! \
            --key-pass pass:HomeoRealm2025! \
            --ks-key-alias homeorealm \
            --out app/build/outputs/apk/release/HomeoRealm.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
        working-directory: homeorealm/packages/web-client/android

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeoRealm-release-apk
          path: homeorealm/packages/web-client/android/app/build/outputs/apk/release/HomeoRealm.apk
          retention-days: 30
